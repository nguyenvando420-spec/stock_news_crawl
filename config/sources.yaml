    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1.ArticleHeader-headline::text, h1::text"
      description: 'meta[name="description"]::attr(content)'
      content: ".ArticleBody-articleBody"
      author: ".Author-authorName::text"
      remove: ".InlineImage-wrapper, .RelatedContent-container, .SponsoredContent"

