    max_items: 5
    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1.article-title::text, h1.title::text, h1::text"
      description: ".article-summary::text, .sapo::text"
      content: "div.article-content, #channel-detail"
      author: ".author::text"
      remove: ".article-sharing, .rightdetail, .article-fbs-sharing, .top_date_social, .social_shares, .tags, .banner"

  baodautu_finance:
    enabled: true
    name: Bao Dau Tu - Dau tu tai chinh
    region: VN
    country: VN
    language: vi
