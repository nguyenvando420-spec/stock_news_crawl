  vietnamnews_economy:
    enabled: true
    name: Viet Nam News - Economy
    region: VN
    country: VN
    language: en
    category: economy
    discovery: html
    start_url: https://vietnamnews.vn/economy/
    link_selector: 'a::attr(href)'
    include_regex: 'https?://vietnamnews\.vn/economy/[0-9]+/'
    max_items: 5
    enrich_article: true
    renderer: scrapy
    selectors:
      title: "h1.headline::text, h1.title::text, meta[property='og:title']::attr(content)"
      description: ".detail__summary, .sapo, meta[name='description']::attr(content)"
      content: ".detail__content, div.content"
      author: ".detail__author::text, .author::text"
      remove: ".detail__tags, .tags, .social-share, .box-category, .banner, .ad, [class*='relate']"

  vov_economy:
    enabled: true
    name: VOV - Kinh te
    region: VN
    country: VN
    language: vi
    category: economy
    discovery: html
    start_url: https://vov.vn/kinh-te
    link_selector: 'a::attr(href)'
    include_regex: 'https?://vov\.vn/kinh-te/.+\.vov$'
    max_items: 5
    enrich_article: true
    renderer: crawl4ai

  vietnamnet_business:
    enabled: true
    name: VietNamNet - Kinh doanh
    region: VN
    country: VN
    language: vi
    category: business
    discovery: html
    start_url: https://vietnamnet.vn/kinh-doanh
    link_selector: 'a::attr(href)'
    include_regex: 'https?://vietnamnet\.vn/.+-[0-9]+\.html$'
    max_items: 5
    enrich_article: true
    renderer: crawl4ai

  nhandan_economy:
    enabled: true
    name: Nhan Dan - Kinh te
    region: VN
    country: VN
    language: vi
    category: economy
    discovery: html
    start_url: https://nhandan.vn/kinhte/
    link_selector: 'a::attr(href)'
    include_regex: 'https?://nhandan\.vn/.+-post[0-9]+\.html$'
    max_items: 5
