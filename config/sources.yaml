      remove: ".news-relate, .ad-banner, .box-category, .social-share, .tags, .emagazine-sidebar"

  vietnamplus_stocks:
    enabled: true
    name: VietnamPlus - Chung khoan
    region: VN
    country: VN
    language: vi
    category: stocks
    discovery: rss
