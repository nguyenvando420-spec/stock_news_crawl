    selectors:
      title: "h1.article__title::text, h1::text"
      description: ".article__sapo, .cms-desc, meta[name='description']::attr(content)"
      content: ".article__body, .cms-body, .zce-content-body"
      author: ".article__author::text, .author::text"
      remove: ".article__relate, .box-relate, .box-content, .content-list, .social-share, .tags"

  vtv_finance:
    enabled: true
