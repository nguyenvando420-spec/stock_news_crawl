sources:
  # ==============================================================================
  # CẤU HÌNH DOM SELECTORS CHO TỪNG WEBSITE:
  #   selectors:
  #     title:       Selector tiêu đề (vd: "h1.title::text, h1::text")
  #     description: Selector tóm tắt/sapo (vd: ".sapo::text, p.description::text")
  #     content:     Selector khung bài viết (vd: ".contentdetail, article.fck_detail")
  #     author:      Selector tác giả (vd: ".author::text, p.author::text")
  #     remove:      Selector các phần tử rác cần xóa (quảng cáo, bài liên quan, tag)
  #
  # * Nếu không khai báo `selectors`, hệ thống tự dùng Smart Fallback để lọc sạch rác.
  # ==============================================================================

  # =========================
  # VIET NAM
  # =========================
  cafef_stock:
    enabled: true
    name: CafeF - Thi truong chung khoan
    region: VN
    country: VN
    language: vi
    category: stocks
    discovery: rss
    feed_url: https://cafef.vn/thi-truong-chung-khoan.rss
    max_items: 5
    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1.title::text, h1::text"
      description: ".sapo::text"
      content: ".detail-content.afcbc-body, .contentdetail"
      author: ".author::text, .source::text"
      remove: ".tindnd, .relate-container, .link-content-footer, .box-category, .ad-banner, .social-share, .tags, .bottom-info, .btn_chiase, .v2-news-detail-comment"

  vnexpress_business:
    enabled: true
    name: VnExpress - Kinh doanh
    region: VN
    country: VN
    language: vi
    category: business
    discovery: rss
    feed_url: https://vnexpress.net/rss/kinh-doanh.rss
    max_items: 5
    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1.title-detail::text, h1::text"
      description: "p.description::text"
      content: "article.fck_detail, .fck_detail"
      author: "p.author::text, p.Normal strong::text"
      remove: ".box-category, .box-tuyendung, .banner-ads, .list-news-related, .comment, .social-pin"

  vneconomy_stocks:
    enabled: true
    name: VnEconomy - Chung khoan
    region: VN
    country: VN
    language: vi
    category: stocks
    discovery: rss
    feed_url: https://vneconomy.vn/chung-khoan.rss
    max_items: 5
    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1.detail__title::text, h1::text"
      description: ".detail__summary::text"
      content: ".detail__content"
      author: ".detail__author::text"
      remove: ".detail__relate, .banner, .box-category, .social-share"

  vietstock_stocks:
    enabled: true
    name: Vietstock - Stocks
    region: VN
    country: VN
    language: en
    category: stocks
