      content: ".article__body, .cms-body, .zce-content-body"
      author: ".article__author::text, .author::text"
      remove: ".article__relate, .box-relate, .social-share, .tags, .box-category, .box-content, .content-list"

  # =========================
  # GLOBAL / INTERNATIONAL
  # =========================
  investing_stock_market:
    enabled: true
    name: Investing.com - Stock Market News
    region: GLOBAL
    country: US
    language: en
    category: stocks
    discovery: rss
    feed_url: https://www.investing.com/rss/news_25.rss
    max_items: 5
    enrich_article: true
    renderer: crawl4ai
    selectors:
      title: "h1::text"
      description: "div[class*='article_WYSIWYG'] > div:first-child > p:first-of-type, meta[name='description']::attr(content)"
      content: "div[class*='article_WYSIWYG'] > div:first-child, #article > div:first-child, div[class*='article_WYSIWYG'], #article"
      author: "[class*='author']::text, a[href*='/members/']::text"
      remove: "div[class*='items-start'], div[class*='md:mb-8'], [class*='highcharts'], [class*='ProPicks'], [class*='border-[#E6E9EB]'], [class*='leading-normal'], button, form"

  cnbc_business:
