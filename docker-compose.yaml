name: stock-news-crawl4ai

# Stack tối giản: Crawl4AI (Python SDK + Chromium headless) -> PostgreSQL
#
#   docker compose up -d                                    # JOB: postgres + crawler chạy nền, mỗi 10 phút lấy bài đăng HÔM NAY
#   CRAWL_INTERVAL_MINUTES=15 docker compose up -d          # đổi chu kỳ
#   docker compose logs -f crawler                          # xem log
#
#   Dữ liệu lịch sử - chạy tay 1 lần, truyền ngày đăng:
#   docker compose run --rm crawler --date 2026-10-01
#   docker compose run --rm crawler --from 2026-09-25 --to 2026-09-30 --site cafef
#
#   Khác (truyền tham số => ghi đè command, không lặp):
#   docker compose run --rm crawler --list-sites            # các site trong config/sites.yaml
#   docker compose run --rm crawler --dry-run --today       # xem trước link + ngày đăng
#
# Thêm/sửa website: chỉ sửa config/sites.yaml (được mount vào container, không cần build lại).

services:
  # ========================================================
  # 1. DATABASE (PostgreSQL)
  # ========================================================
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawl4ai_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-news_db}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-news_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - crawl-net
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # 2. CRAWLER (Crawl4AI Python SDK, build từ unclecode/crawl4ai:0.8.6)
  # ========================================================
  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    image: stock-news-crawl4ai-crawler:latest
    restart: unless-stopped
    # Job định kỳ: chỉ lấy bài ĐĂNG HÔM NAY; URL đã có trong DB sẽ bị bỏ qua (trừ khi --force)
    command: ["--today", "--interval-minutes", "${CRAWL_INTERVAL_MINUTES:-10}"]
    # Image gốc có HEALTHCHECK gọi API server :11235 - service này chỉ dùng SDK nên tắt đi
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-crawl4ai_password_2026}@postgres:5432/${POSTGRES_DB:-news_db}
      CRAWL_SITES: ${CRAWL_SITES:-}          # rỗng = mọi site enabled; vd: cafef,vietstock
      CRAWL_PAGES: ${CRAWL_PAGES:-1}
      CRAWL_MAX_ARTICLES: ${CRAWL_MAX_ARTICLES:-30}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-3}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-50}   # giới hạn số trang listing khi lọc theo ngày
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./config:/opt/crawler/config:ro
    # Chromium cần shared memory lớn, tránh crash khi mở nhiều tab
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crawl-net
    logging: *default-logging

networks:
  crawl-net:
    driver: bridge

volumes:
  postgres_data:
